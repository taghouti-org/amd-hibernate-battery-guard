# /etc/systemd/sleep.conf.d/hibernate-mode.conf
#
# After writing the hibernate image, power off directly instead of entering ACPI S4
# ("platform" mode). On some AMD laptops (seen on a ThinkPad T14 Gen 5, Ryzen 8840U)
# S4 entry gets aborted by a wakeup event (lid, external display), so the machine
# resumes IN PLACE without ever powering off. On that path amdgpu can hang
# (sdma0 ring timeout, GPU reset fails), the compositor gets stuck, every later sleep
# attempt fails, and the battery drains to 0% with the lid closed.
#
# Trade-off: only the power button resumes from hibernate (lid/keyboard won't).
[Sleep]
HibernateMode=shutdown
